---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server-local
  template:
    metadata:
      labels:
        app: config-server-local
    spec:
      containers:
      - name: config-server-local
        image: 405834051687.dkr.ecr.us-east-1.amazonaws.com/configserverlocal:9
        imagePullPolicy: Always
        ports:
        - containerPort: 8888
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "native,kubernetes"
        - name: SERVER_PORT
          value: "8888"
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://dashboard-eureka-server:8761/eureka/"
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "config-server-local"
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          value: "false"
        - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
          value: "true"
        - name: EUREKA_CLIENT_FETCH_REGISTRY
          value: "true"
        - name: EUREKA_CLIENT_HEALTHCHECK_ENABLED
          value: "true"
        - name: EUREKA_INSTANCE_INSTANCE_ID
          value: "config-server-local:config-server-application:8888"
        - name: EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS
          value: "10"
        - name: EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS
          value: "90"
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: postgres-password
        livenessProbe:
          tcpSocket:
            port: 8888
          initialDelaySeconds: 45
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8888
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: config-server-local
spec:
  type: ClusterIP
  selector:
    app: config-server-local
  ports:
  - name: http
    port: 8888
    targetPort: 8888
