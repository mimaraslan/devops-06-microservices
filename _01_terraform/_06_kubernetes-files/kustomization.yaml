apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tum manifestler yalnizca default namespace'e gider (dev/argocd icinde 2. postgres PVC/volume olusmasin)
namespace: default

resources:
  - postgres-storageclass.yaml
  - postgres-pvc.yaml
  - postgres.yaml
  - postgres-init-job.yaml
  - redis.yaml
  - redpanda.yaml
  - keycloak.yaml
  - keycloak-init-job.yaml
  - eureka-server-config.yaml
  - dashboardeurekaserver.yaml
  - api-gateway-k8s-config.yaml
  - configserverlocal.yaml
  - accountservice.yaml
  - ledgerservice.yaml
  - fraudservice.yaml
  - notificationservice.yaml
  - apigatewayservice.yaml

configMapGenerator:
  - name: public-elb-config
    options:
      disableNameSuffixHash: true
    literals:
      - LB_NAME=project-ms-public-lb

replacements:
  - source:
      kind: ConfigMap
      name: public-elb-config
      fieldPath: data.LB_NAME
    targets:
      - select:
          kind: Service
          name: api-gateway-service
        fieldPaths:
          - metadata.annotations.[service.beta.kubernetes.io/aws-load-balancer-name]
      - select:
          kind: Service
          name: dashboard-eureka-server
        fieldPaths:
          - metadata.annotations.[service.beta.kubernetes.io/aws-load-balancer-name]
