server:
  port: 8761

spring:
  application:
    name: dashboard-eureka-server
  boot:
    admin:
      context-path: /admin
  cloud:
    service-registry:
      auto-registration:
        enabled: false

eureka:
  client:
    registryFetchIntervalSeconds: 5
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
  instance:
    leaseRenewalIntervalInSeconds: 10
